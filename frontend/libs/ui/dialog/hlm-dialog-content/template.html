<!-- Fallback scroll on short screens, kept inside so the close button stays visible.
     -m-1 p-1: focus rings of fields at the edge are not clipped. -->
<div class="-m-1 flex min-h-0 flex-1 flex-col gap-6 overflow-y-auto p-1">
	@if (component) {
		<ng-container [ngComponentOutlet]="component" />
	} @else {
		<ng-content />
	}
</div>

@if (showCloseButton()) {
	<button hlmBtn variant="ghost" size="icon-sm" class="absolute end-4 top-4" hlmDialogClose>
		<span class="sr-only">{{ closeLabel() }}</span>
		<ng-icon name="lucideX" />
	</button>
}
