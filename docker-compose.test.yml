# Test stack: used by scripts/test.sh, never by the working stack.
#   docker compose -p firescrum-test -f docker-compose.yml -f docker-compose.test.yml up
# In-memory database (lost when the container stops). Front port set by test.sh (4201).
services:
  db:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  # Browser tests (Playwright, tests/e2e/Dockerfile), on the test stack network: they reach the front
  # and the database by service name. Profile: never started by `up`, only by `run`; the arguments
  # go to Playwright, `--ui` opens the UI mode on http://localhost:9324.
  e2e:
    profiles: [e2e]
    build: ./tests/e2e
    init: true
    volumes:
      - ./tests/e2e:/e2e
      # Hides the local node_modules (IDE types): the image's own dependencies are used.
      - /e2e/node_modules
    environment:
      BASE: http://frontend
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HOST_UID: ${HOST_UID:-}
    ports:
      - "127.0.0.1:9324:9324"
