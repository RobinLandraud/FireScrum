[package]
name = "firescrum-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio", "macros", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
