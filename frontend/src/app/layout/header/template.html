<header class="sticky top-0 z-30 flex h-16 items-center justify-between gap-3 border-b bg-card px-4 lg:px-6">
  <button
    type="button"
    class="inline-flex size-10 items-center justify-center rounded-[10px] border border-input text-muted-foreground shadow-xs transition-colors hover:bg-muted hover:text-foreground"
    aria-label="Afficher ou masquer le menu"
    [attr.aria-expanded]="sidebar.mobileOpen()"
    (click)="sidebar.toggle()"
  >
    <ng-icon name="matMenuOutline" size="20" />
  </button>

  <button
    type="button"
    class="inline-flex size-10 items-center justify-center rounded-full border border-input text-muted-foreground shadow-xs transition-colors hover:bg-muted hover:text-foreground"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'"
    (click)="theme.toggle()"
  >
    <ng-icon [name]="theme.theme() === 'dark' ? 'matLightModeOutline' : 'matDarkModeOutline'" size="20" />
  </button>
</header>
