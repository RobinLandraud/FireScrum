<header class="sticky top-0 z-30 flex h-16 items-center justify-between gap-3 bg-card px-4 lg:px-6">
  <button
    type="button"
    class="inline-flex size-10 items-center justify-center rounded-[10px] text-muted-foreground shadow-raised-sm transition-[color,box-shadow] hover:text-foreground active:shadow-inset"
    aria-label="Afficher ou masquer le menu"
    [attr.aria-expanded]="sidebar.mobileOpen()"
    (click)="sidebar.toggle()"
  >
    <ng-icon name="matMenuOutline" size="20" />
  </button>

  <button
    type="button"
    class="inline-flex size-10 items-center justify-center rounded-full text-muted-foreground shadow-raised-sm transition-[color,box-shadow] hover:text-foreground active:shadow-inset"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'"
    (click)="theme.toggle()"
  >
    <ng-icon [name]="theme.theme() === 'dark' ? 'matLightModeOutline' : 'matDarkModeOutline'" size="20" />
  </button>
</header>
