# Test stack: used by `just tests`, never by the working stack.
#   docker compose -p firescrum-test -f docker-compose.yml -f docker-compose.test.yml up
# In-memory database (lost when the container stops). Front port set by `just tests` (4201).
services:
  db:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  # API and browser tests (Playwright, tests/Dockerfile), on the test stack network: they reach the
  # front and the database by service name. Profile: never started by `up`, only by `run`; the
  # arguments go to Playwright (--back, --front, --ui: see tests/entrypoint.sh).
  tests:
    profiles: [tests]
    build: ./tests
    init: true
    volumes:
      - ./tests:/tests
      # Hides the local node_modules (IDE types): the image's own dependencies are used.
      - /tests/node_modules
    environment:
      BASE: http://frontend
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HOST_UID: ${HOST_UID:-}
    ports:
      - "127.0.0.1:9324:9324"
