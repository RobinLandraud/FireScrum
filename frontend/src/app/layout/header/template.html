<!-- Mobile only (spec 013): the menu button, in a frosted bar so it never sits on the animated background. -->
<header class="glass sticky top-0 z-30 flex h-16 items-center px-4 shadow-raised lg:hidden">
  <button
    type="button"
    class="inline-flex size-10 items-center justify-center rounded-[10px] text-muted-foreground shadow-raised-sm transition-[color,box-shadow] hover:text-foreground active:shadow-inset"
    aria-label="Ouvrir le menu"
    [attr.aria-expanded]="sidebar.mobileOpen()"
    (click)="sidebar.toggle()"
  >
    <ng-icon name="matMenuOutline" size="20" />
  </button>
</header>
